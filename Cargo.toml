[package]
name = "weekly-gh-digest"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "large-dates"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tempfile = "3"

