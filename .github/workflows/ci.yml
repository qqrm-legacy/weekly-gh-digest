name: CI

on:
  pull_request:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Workflow and queue tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --tests --benches

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        timeout-minutes: 15
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dependency-tools-target
        run: cargo install --debug --locked --version '=0.9.151' cargo-nextest

      - name: Test with nextest
        run: cargo nextest run --locked --no-tests=pass --no-fail-fast

      - name: Verify publication-disabled CLI boundaries
        run: |
          cargo build --locked
          python3 .github/scripts/verify_publication_disabled.py ./target/debug/weekly-gh-digest
          python3 .github/scripts/verify_release_runtime.py ./target/debug/weekly-gh-digest

      - name: Install dependency tooling
        timeout-minutes: 20
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dependency-tools-target
        run: |
          cargo install --debug --locked --version '=0.22.2' cargo-audit
          cargo install --debug --locked --version '=0.20.2' cargo-deny
          cargo install --debug --locked --version '=0.9.2' cargo-machete

      - name: Audit dependencies
        run: cargo audit

      - name: Check dependency advisories and sources
        run: cargo deny check advisories bans sources

      - name: Check unused dependencies
        run: cargo machete

  ci-gate:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        env:
          RESULT_0: ${{ needs.checks.result }}
        run: |
          test "$RESULT_0" = success

