name: Evening digest validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evening-digest-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/retained-daily-weekly-digests-2026-10-31'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIGEST_DELIVERY_ENABLED: 'false'
      DIGEST_DAILY_DELIVERY_ENABLED: 'false'
    steps:
      - name: Checkout committed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Static checks
        run: |
          cargo fmt --all -- --check
          cargo check --locked --tests --benches
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install nextest
        timeout-minutes: 15
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dependency-tools-target
        run: cargo install --debug --locked --version '=0.9.151' cargo-nextest
      - name: Test schedules, state, language and publication boundaries
        run: |
          cargo nextest run --locked --no-tests=pass --no-fail-fast
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          cargo build --locked
          python3 .github/scripts/verify_publication_disabled.py ./target/debug/weekly-gh-digest
          git diff --exit-code
          mkdir -p validation-artifacts
          git rev-parse HEAD > validation-artifacts/tested-commit.txt
      - name: Daily preview using free provider and a local state copy only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_FREE_TIER_CONFIRMED: ${{ vars.LLM_FREE_TIER_CONFIRMED }}
        run: python3 .github/scripts/evening_preview.py
      - name: Upload validation and preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evening-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-artifacts
          if-no-files-found: warn
          retention-days: 14
