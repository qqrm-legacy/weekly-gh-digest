name: Evening digest validation

on:
  push:
    branches: [feat/retained-daily-weekly-digests-2026-10-31]
    paths:
      - .github/workflows/evening-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evening-digest-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/feat/retained-daily-weekly-digests-2026-10-31'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIGEST_DELIVERY_ENABLED: 'false'
      DIGEST_DAILY_DELIVERY_ENABLED: 'false'
    steps:
      - name: Checkout committed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Static checks
        run: |
          cargo fmt --all -- --check
          cargo check --locked --tests --benches
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
          fallback: none
      - name: Test schedules, state, language and publication boundaries
        run: |
          cargo nextest run --locked --no-tests=pass --no-fail-fast
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          cargo build --locked
          python3 .github/scripts/verify_publication_disabled.py ./target/debug/weekly-gh-digest
          git diff --exit-code
          mkdir -p validation-artifacts
          git rev-parse HEAD > validation-artifacts/tested-commit.txt
      - name: Daily preview using free provider and a local state copy only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_FREE_TIER_CONFIRMED: ${{ vars.LLM_FREE_TIER_CONFIRMED }}
          PREVIEW_OUTPUT: ${{ runner.temp }}/evening-output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0,'.github/scripts')
          import remote_state
          remote = remote_state.api('/contents/weekly-gh-digest.json?ref=delivery-state')
          if remote is None:
              raise RuntimeError('Authoritative observations unavailable')
          state = json.loads(remote_state.decode(remote))
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/state.json').write_text(json.dumps(state))
          pathlib.Path('validation-artifacts/provenance.json').write_text(json.dumps({'source_state_blob':remote['sha'],'production_state_writes':0,'telegram_calls':0,'llm_provider':'Groq','paid_fallback':False},indent=2))
          PY
          # This dry-run has no Telegram credentials and never writes remote state.
          # Override the child process only; the normal hosted sender still requires its checkpoint.
          env GITHUB_ACTIONS=false GITHUB_OUTPUT="$PREVIEW_OUTPUT" ./target/debug/weekly-gh-digest preview --daily --dry-run --llm > validation-artifacts/preview.log 2>&1
          python3 - <<'PY'
          import json, os, pathlib, shutil, sys
          sys.path.insert(0,'.github/scripts')
          import daily_run
          paths = [line.split('=',1)[1] for line in pathlib.Path(os.environ['PREVIEW_OUTPUT']).read_text().splitlines() if line.startswith('run_directory=')]
          directory = pathlib.Path(paths[-1])
          digest = json.loads((directory/'ranking-input.json').read_text())
          daily_run.validate_preview(directory,digest['delivery_slot'])
          if not digest['entries'] or not digest.get('overview','').strip():
              raise RuntimeError('A nonempty daily AI preview is required')
          if not all(row.get('llm_used') for row in digest['entries']):
              raise RuntimeError('Raw source fallback reached daily preview')
          shutil.copytree(directory,'validation-artifacts/daily',dirs_exist_ok=True)
          result = {'cards':len(digest['entries']),'overview':digest['overview'],'all_cards_ai':True,'llm_budget':digest['llm_budget'],'queue':digest['queue'],'telegram_calls':0,'production_state_writes':0}
          pathlib.Path('validation-artifacts/report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Preserve diagnostics after a failed preview
        if: failure()
        shell: bash
        run: |
          mkdir -p validation-artifacts
          if [ -d data/runs ]; then cp -a data/runs validation-artifacts/failed-runs; fi
      - name: Upload validation and preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evening-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-artifacts
          if-no-files-found: warn
          retention-days: 14
