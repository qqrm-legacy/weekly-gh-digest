name: Dependabot Automerge

# Privileged metadata-only workflow; never check out or run PR content.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI, Workflow Security, AppSec]
    types: [completed]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-green-automerge
  cancel-in-progress: false

jobs:
  automerge:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: read
      statuses: read
    steps:
      - name: Merge only fully checked signed Dependabot commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUIRED_CHECKS: '["ci-gate","workflow-security-gate","checks","dependency-policy","actionlint","zizmor"]'
        run: |
          set -euo pipefail

          prs="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,author,headRefName \
            --jq '.[] | select((.author.login == "app/dependabot" or .author.login == "dependabot[bot]") and (.headRefName | startswith("dependabot/"))) | .number')"
          if [ -z "$prs" ]; then
            echo 'No open Dependabot PRs.'
            exit 0
          fi

          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            info="$(gh pr view "$pr" --repo "$REPO" --json author,isCrossRepository,headRefName,headRefOid,baseRefName,isDraft,state,mergeStateStatus,statusCheckRollup)"
            if ! jq -e '
              (.author.login == "app/dependabot" or .author.login == "dependabot[bot]") and
              .isCrossRepository == false and .baseRefName == "main" and
              (.headRefName | startswith("dependabot/")) and
              .isDraft == false and .state == "OPEN" and
              .mergeStateStatus == "CLEAN"
            ' <<< "$info" >/dev/null; then
              echo "PR #$pr is not currently mergeable; skipping."
              continue
            fi

            head="$(jq -r '.headRefOid' <<< "$info")"
            if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "PR #$pr has an invalid head SHA; skipping."
              continue
            fi
            checks="$(jq -c '.statusCheckRollup' <<< "$info")"
            if ! jq -e --argjson required "$REQUIRED_CHECKS" '
              length > 0 and
              (. as $all |
                ($required - [$all[] | select(.__typename == "CheckRun" and .status == "COMPLETED" and .conclusion == "SUCCESS") | .name] | length == 0) and
                all($all[];
                  if .__typename == "CheckRun" then
                    .status == "COMPLETED" and
                    (.conclusion == "SUCCESS" or .conclusion == "NEUTRAL" or .conclusion == "SKIPPED")
                  elif .__typename == "StatusContext" then .state == "SUCCESS"
                  else false end))
            ' <<< "$checks" >/dev/null; then
              echo "PR #$pr: required checks missing, pending, or failed."
              continue
            fi

            commits="$(gh api "repos/$REPO/pulls/$pr/commits?per_page=100" --paginate --slurp)"
            if ! jq -e --arg head "$head" '
              add | length > 0 and .[-1].sha == $head and
              all(.[]; .author.login == "dependabot[bot]" and
                .committer.login == "web-flow" and .commit.verification.verified == true)
            ' <<< "$commits" >/dev/null; then
              echo "PR #$pr: unsigned or non-Dependabot commits."
              continue
            fi

            base="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
            comparison="$(gh api "repos/$REPO/compare/$base...$head")"
            if ! jq -e --arg base "$base" '
              .behind_by == 0 and .merge_base_commit.sha == $base
            ' <<< "$comparison" >/dev/null; then
              echo "PR #$pr: needs rebase onto current main."
              continue
            fi
            if [ "$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" != "$base" ] ||
               [ "$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)" != "$head" ]; then
              echo "PR #$pr: base or head advanced; skipping."
              continue
            fi

            # Native auto-merge is unavailable on some private/free repositories.
            # This direct merge requires complete real checks and verified provenance.
            if gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$head"; then
              echo "Merged PR #$pr at verified head $head."
            else
              echo "PR #$pr merge rejected; retry on the next event."
            fi
          done <<< "$prs"
