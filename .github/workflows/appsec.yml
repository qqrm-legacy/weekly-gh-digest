name: AppSec
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: qqrm-labs/.github/.github/workflows/security.yml@e92efba3e5c6602e28860d91aa6d77c8f2c73b7c
    with:
      language: rust
      # CodeQL requires Code Security, which is unavailable for this private repository.
      # Gitleaks, workflow auditing, and the Rust CI security checks remain enabled.
      codeql-mode: unavailable
