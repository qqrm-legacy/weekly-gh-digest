name: Weekly Recovery

# Retained for explicit manual diagnostics only. No schedule or push trigger.
# Run Bot checks durable completion; this workflow can only request a preview.
on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: weekly-recovery
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request idempotent weekly preview recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run run-bot.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f dry_run=true -f recover_weekly=true -f deliver_to_main_chat=false
