name: Run Bot

on:
  workflow_call:
    inputs:
      operation:
        description: Explicit collection, read-only preview, or daily publication
        type: string
        required: true
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      TELEGRAM_TECH_CHAT_ID:
        required: false
      GROQ_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      digest_format:
        description: Select the daily discoveries or weekly summary
        type: choice
        options: [weekly, daily]
        default: weekly
      dry_run:
        description: Build and upload a preview without sending to the technical chat
        type: boolean
        default: true
      recover_weekly:
        description: Recover the current weekly preview only if its artifact is missing; never send
        type: boolean
        default: false
      preview_with_llm:
        description: Enrich the dry-run artifact using the confirmed free provider; never send
        type: boolean
        default: false
      deliver_to_main_chat:
        description: Send the selected digest now (requires its delivery gates)
        type: boolean
        default: false
      retry_delivery_run_id:
        description: Reuse stored analyses and run the deterministic credential scan before delivery
        type: string
        required: false
      preview_source_run_id:
        description: Re-render a successful main run offline; no provider calls or sending
        type: string
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: weekly-gh-digest
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve latest published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SELECTION: ${{ runner.temp }}/weekly-gh-digest-release.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*', repository):
              raise SystemExit('Invalid repository')
          def api(path):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', '--hostname', 'github.com', '-H', 'Accept: application/vnd.github+json',
                   f'repos/{repository}/{path}'], text=True, timeout=60))
          release = api('releases/latest')
          if (release.get('draft') is not False or release.get('prerelease') is not False
                  or not release.get('published_at')):
              raise SystemExit('Latest release must be published and stable')
          tag = release.get('tag_name', '')
          if not isinstance(tag, str) or not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('Latest release must have a stable vMAJOR.MINOR.PATCH tag')
          reference = api(f'git/ref/tags/{tag}')
          if reference.get('ref') != f'refs/tags/{tag}':
              raise SystemExit('Release tag reference does not match')
          obj = reference.get('object', {})
          for _ in range(8):
              sha = obj.get('sha', '')
              if not isinstance(sha, str) or not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise SystemExit('Release reference has no full object SHA')
              if obj.get('type') == 'commit':
                  break
              if obj.get('type') != 'tag':
                  raise SystemExit('Release tag does not reference a commit')
              obj = api(f'git/tags/{sha}').get('object', {})
          else:
              raise SystemExit('Release tag nesting is too deep')
          commit = api(f'commits/{sha}').get('sha')
          if commit != sha:
              raise SystemExit('Resolved release commit does not match')
          selection = {'repository': repository, 'release': release, 'commit': commit}
          Path(os.environ['RELEASE_SELECTION']).write_text(json.dumps(selection), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\ncommit={commit}\n')
          PY

      - name: Checkout selected release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the split-workflow runtime contract
        if: inputs.operation != ''
        run: grep -q 'SPLIT_WORKFLOW_CONTRACT = 1' .github/scripts/run_mode.py

      - name: Install verified release binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SELECTION: ${{ runner.temp }}/weekly-gh-digest-release.json
        run: python3 .github/scripts/download_release.py install "$RELEASE_SELECTION" --destination bin

      - name: Restore persistent state
        id: restore-state
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
        shell: bash
        run: |
          set -euo pipefail
          # A transport/authentication failure must never mean an absent branch.
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          if [[ -z "$remote_ref" ]]; then
            echo "No bot-state branch yet; confirmed initial bootstrap."
            echo "head=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ok=0
          for attempt in 1 2 3; do
            if git fetch --depth=1 origin bot-state:refs/remotes/origin/bot-state 2>/dev/null; then
              ok=1
              break
            fi
            echo "fetch attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          if [[ "$ok" == "1" ]]; then
            echo "head=$(git rev-parse origin/bot-state)" >> "$GITHUB_OUTPUT"
            mkdir -p data
            git archive origin/bot-state data | tar -x
          else
            echo "bot-state exists but could not be fetched; refusing empty dedup state" >&2
            exit 1
          fi

      - name: Restore authoritative delivery checkpoint
        id: restore-delivery
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_STATE_KEY: weekly-gh-digest.json
          ARCHIVE_HEAD: ${{ steps.restore-state.outputs.head }}
          RUN_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 .github/scripts/remote_state.py restore data/state.json || status=$?
          if [[ "$status" == 3 ]]; then
            if [[ "${RUN_OPERATION:-}" == preview ]]; then
              echo "Read-only preview requires an existing checkpoint" >&2
              exit 1
            fi
            if [[ ! -f data/state.json ]]; then
              test -z "$ARCHIVE_HEAD" || { echo "Existing archive has no state; refusing empty delivery memory" >&2; exit 1; }
              mkdir -p data
              printf '{}\n' > data/state.json
            fi
            python3 .github/scripts/remote_state.py save data/state.json
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi

      - name: Select collection, preview, or enabled publication
        id: mode
        env:
          PLAN_FILE: ${{ runner.temp }}/weekly-run-plan.json
          RECOVER_WEEKLY: ${{ inputs.recover_weekly }}
          RUN_OPERATION: ${{ inputs.operation }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DIGEST_DELIVERY_ENABLED: ${{ vars.DIGEST_DELIVERY_ENABLED }}
          DIGEST_DAILY_DELIVERY_ENABLED: ${{ vars.DIGEST_DAILY_DELIVERY_ENABLED }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          DIGEST_FORMAT: ${{ inputs.digest_format }}
          PREVIEW_WITH_LLM: ${{ inputs.preview_with_llm }}
          DELIVER_TO_MAIN_CHAT: ${{ inputs.deliver_to_main_chat }}
          RETRY_DELIVERY_RUN_ID: ${{ inputs.retry_delivery_run_id }}
          PREVIEW_SOURCE_RUN_ID: ${{ inputs.preview_source_run_id }}
        run: python3 .github/scripts/run_mode.py
      - name: Collect, preview, or deliver digest
        id: prepare
        env:
          DELIVERY_CHECKPOINT: .github/scripts/remote_state.py
          DELIVERY_STATE_KEY: weekly-gh-digest.json
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ inputs.operation != 'collect' && inputs.operation != 'preview' && steps.mode.outputs.send == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ inputs.operation != 'collect' && inputs.operation != 'preview' && steps.mode.outputs.send == 'true' && secrets.TELEGRAM_CHAT_ID || '' }}
          TELEGRAM_TECH_CHAT_ID: ${{ inputs.operation != 'collect' && inputs.operation != 'preview' && steps.mode.outputs.send == 'true' && secrets.TELEGRAM_TECH_CHAT_ID || '' }}
          GROQ_API_KEY: ${{ inputs.operation != 'collect' && inputs.operation != 'preview' && steps.mode.outputs.llm == 'true' && secrets.GROQ_API_KEY || '' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_FREE_TIER_CONFIRMED: ${{ vars.LLM_FREE_TIER_CONFIRMED }}
          GH_TOKEN: ${{ github.token }}
          RETRY_DELIVERY_RUN_ID: ${{ inputs.retry_delivery_run_id }}
          PREVIEW_SOURCE_RUN_ID: ${{ inputs.preview_source_run_id }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          RUN_OPERATION: ${{ inputs.operation }}
          EXPECTED_DAILY_SLOT: ${{ steps.mode.outputs.slot }}
          USE_LLM: ${{ steps.mode.outputs.llm }}
          DIGEST_DELIVERY_ENABLED: ${{ vars.DIGEST_DELIVERY_ENABLED }}
          DIGEST_DAILY_DELIVERY_ENABLED: ${{ vars.DIGEST_DAILY_DELIVERY_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          bot=./bin/weekly-gh-digest
          if [[ "$RUN_MODE" == "skip" ]]; then
            echo "Publication already completed; no collection or provider requests."
          elif [[ "$RUN_MODE" == "daily-offline-preview" ]]; then
            test -z "${TELEGRAM_BOT_TOKEN:-}${TELEGRAM_CHAT_ID:-}${TELEGRAM_TECH_CHAT_ID:-}${GROQ_API_KEY:-}"
            before=$(sha256sum data/state.json)
            preview_dir="data/runs/preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            env -u DELIVERY_CHECKPOINT "$bot" preview-retained data/state.json "$preview_dir" --daily
            test "$(sha256sum data/state.json)" = "$before"
            test -s "$preview_dir/ranking-input.json"
            test -s "$preview_dir/queue.json"
            printf 'run_directory=%s\n' "$preview_dir" >> "$GITHUB_OUTPUT"
          elif [[ "$RUN_MODE" == "preview-stored" ]]; then
            [[ "$PREVIEW_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
            source=$(gh run view "$PREVIEW_SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,conclusion)
            case "$(jq -r .workflowName <<<"$source")" in
              "Run Bot"|"Publish Digest"|"Digest Rollout") ;;
              *) exit 1 ;;
            esac
            [[ "$(jq -r .headBranch <<<"$source")" == "main" ]]
            [[ "$(jq -r .conclusion <<<"$source")" == "success" ]]
            source_dir="$RUNNER_TEMP/weekly-preview-$PREVIEW_SOURCE_RUN_ID"
            mkdir -p "$source_dir"
            gh run download "$PREVIEW_SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "weekly-gh-digest-$PREVIEW_SOURCE_RUN_ID" --dir "$source_dir"
            test -f "$source_dir/ranking-input.json"
            preview_dir="data/runs/refreshed-$GITHUB_RUN_ID"
            mkdir -p "$preview_dir"
            cp -a "$source_dir/." "$preview_dir/"
            printf '{"source_run_id":%s}\n' "$PREVIEW_SOURCE_RUN_ID" > "$preview_dir/preview-source.json"
            "$bot" preview-stored "$preview_dir"
          elif [[ "$RUN_MODE" == "retry" ]]; then
            [[ "$RETRY_DELIVERY_RUN_ID" =~ ^[0-9]+$ ]]
            source=$(gh run view "$RETRY_DELIVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch)
            case "$(jq -r .workflowName <<<"$source")" in
              "Run Bot"|"Publish Digest"|"Digest Rollout") ;;
              *) echo "Unexpected source workflow" >&2; exit 1 ;;
            esac
            [[ "$(jq -r .headBranch <<<"$source")" == "$GITHUB_REF_NAME" ]] || { echo "Source run belongs to a different branch" >&2; exit 1; }
            source_dir="$RUNNER_TEMP/weekly-gh-digest-source-$RETRY_DELIVERY_RUN_ID"
            mkdir -p "$source_dir"
            gh run download "$RETRY_DELIVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "weekly-gh-digest-$RETRY_DELIVERY_RUN_ID" --dir "$source_dir"
            source_input=""
            while IFS= read -r candidate; do
              if jq -e '.format_version == 3 and (.entries | length >= 1) and all(.entries[]; (.description | type == "string") and (.description | length > 0))' "$candidate" >/dev/null; then
                source_input="$candidate"
                break
              fi
            done < <(find "$source_dir" -name ranking-input.json -print | sort -r)
            test -n "$source_input"
            delivery_dir="data/runs/retry-$GITHUB_RUN_ID"
            mkdir -p "$delivery_dir"
            cp -a "$(dirname "$source_input")/." "$delivery_dir/"
            "$bot" debug-delivery "$delivery_dir"
          elif [[ "$RUN_MODE" == "daily-digest" ]]; then
            args=(digest --daily --llm)
            if [[ "${RUN_OPERATION:-}" == publish ]]; then args+=(--retained-only); fi
            "$bot" "${args[@]}"
          elif [[ "$RUN_MODE" == "daily-preview" ]]; then
            args=(preview --daily --dry-run)
            if [[ "${RUN_OPERATION:-}" == publish ]]; then args+=(--retained-only); fi
            if [[ "$USE_LLM" == "true" ]]; then args+=(--llm); fi
            "$bot" "${args[@]}"
          elif [[ "$RUN_MODE" == "digest" ]]; then
            "$bot" digest --llm
          elif [[ "$RUN_MODE" == "debug" ]]; then
            "$bot" debug --llm
          elif [[ "$RUN_MODE" == "collect" ]]; then
            "$bot" collect --dry-run
          elif [[ "$RUN_MODE" == "preview" ]]; then
            args=(preview --dry-run)
            if [[ "$USE_LLM" == "true" ]]; then args+=(--llm); fi
            "$bot" "${args[@]}"
          else
            echo 'Unknown run mode; refusing execution' >&2
            exit 1
          fi
      - name: Verify weekly preview artifact
        id: verify-preview
        if: steps.prepare.outputs.delivery_skipped != 'true' && (steps.mode.outputs.mode == 'preview' || steps.mode.outputs.mode == 'digest' || steps.mode.outputs.mode == 'daily-preview' || steps.mode.outputs.mode == 'daily-digest')
        env:
          RUN_DIRECTORY: ${{ steps.prepare.outputs.run_directory }}
          WEEKLY_SLOT: ${{ steps.mode.outputs.slot }}
          PLAN_FILE: ${{ runner.temp }}/weekly-run-plan.json
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [[ "$RUN_MODE" == daily-* ]]; then
            python3 .github/scripts/daily_run.py verify
          else
            python3 .github/scripts/weekly_run.py verify
          fi

      - name: Upload run preview and provenance
        id: upload
        if: always() && steps.prepare.outputs.run_directory != '' && steps.mode.outputs.mode != 'collect'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.mode.outputs.mode == 'daily-offline-preview' && format('weekly-gh-digest-dry-{0}-{1}', github.run_id, github.run_attempt) || format('weekly-gh-digest-{0}', github.run_id) }}
          path: ${{ steps.prepare.outputs.run_directory }}
          if-no-files-found: error
          retention-days: 90

      - name: Record uploaded weekly completion
        if: steps.verify-preview.outcome == 'success' && steps.upload.outcome == 'success'
        env:
          RUN_DIRECTORY: ${{ steps.prepare.outputs.run_directory }}
          WEEKLY_SLOT: ${{ steps.mode.outputs.slot }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          if [[ "$RUN_MODE" == daily-* ]]; then
            python3 .github/scripts/daily_run.py record
          else
            python3 .github/scripts/weekly_run.py record
          fi

      - name: Save state and source provenance
        if: always() && inputs.operation != 'preview' && steps.mode.outcome == 'success' && steps.mode.outputs.mode != 'skip' && steps.restore-state.outcome == 'success' && steps.restore-delivery.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
          RESTORED_STATE_HEAD: ${{ steps.restore-state.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d data ]]; then
            echo "No data directory was created; state was not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          state_dir="$RUNNER_TEMP/weekly-gh-digest-state"
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          remote_head=${remote_ref%%$'\t'*}
          if [[ "$remote_head" != "$RESTORED_STATE_HEAD" ]]; then
            echo "bot-state changed during this run; refusing to overwrite newer state" >&2
            exit 1
          fi
          if [[ -n "$remote_head" ]]; then
            # Reuse the fetched snapshot; the remote head above was checked for changes.
            test "$(git rev-parse origin/bot-state)" = "$RESTORED_STATE_HEAD"
            git worktree add "$state_dir" origin/bot-state
          else
            git worktree add --detach "$state_dir" HEAD
            git -C "$state_dir" checkout --orphan bot-state
            git -C "$state_dir" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$state_dir/data"
          cp -a data/. "$state_dir/data/"
          git -C "$state_dir" add data
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m "Update digest state and source archive"
            git -C "$state_dir" push origin HEAD:bot-state
          fi
