name: Run Bot

on:
  schedule:
    # 07:00 and 19:00 UTC = 10:00 and 22:00 Moscow time: a couple of checks
    # a day, This-Week-in-Rust style but daily. A check posts one compressed
    # batch of fresh top-30 Trending repositories (>=5000 stars) when there
    # are new ones; Probe Trigger remains the safety net for dropped slots.
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload a preview without sending to the technical chat
        type: boolean
        default: true
      deliver_to_main_chat:
        description: Send the daily digest to the main chat right now (overrides dry_run)
        type: boolean
        default: false
      retry_delivery_run_id:
        description: Reuse stored analyses and run the deterministic credential scan before delivery
        type: string
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: weekly-gh-digest
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Cache build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build bot
        run: cargo build --release --locked

      - name: Restore persistent state
        id: restore-state
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
        shell: bash
        run: |
          set -euo pipefail
          # A transport/authentication failure must never mean an absent branch.
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          if [[ -z "$remote_ref" ]]; then
            echo "No bot-state branch yet; confirmed initial bootstrap."
            echo "head=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ok=0
          for attempt in 1 2 3; do
            if git fetch origin bot-state:refs/remotes/origin/bot-state 2>/dev/null; then
              ok=1
              break
            fi
            echo "fetch attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          if [[ "$ok" == "1" ]]; then
            echo "head=$(git rev-parse origin/bot-state)" >> "$GITHUB_OUTPUT"
            mkdir -p data
            git archive origin/bot-state data | tar -x
          else
            echo "bot-state exists but could not be fetched; refusing empty dedup state" >&2
            exit 1
          fi

      - name: Restore authoritative delivery checkpoint
        id: restore-delivery
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_STATE_KEY: weekly-gh-digest.json
          ARCHIVE_HEAD: ${{ steps.restore-state.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 .github/scripts/remote_state.py restore data/state.json || status=$?
          if [[ "$status" == 3 ]]; then
            if [[ ! -f data/state.json ]]; then
              test -z "$ARCHIVE_HEAD" || { echo "Existing archive has no state; refusing empty delivery memory" >&2; exit 1; }
              mkdir -p data
              printf '{}\n' > data/state.json
            fi
            python3 .github/scripts/remote_state.py save data/state.json
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi

      - name: Collect, preview, or deliver digest
        env:
          DELIVERY_CHECKPOINT: .github/scripts/remote_state.py
          DELIVERY_STATE_KEY: weekly-gh-digest.json
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TECH_CHAT_ID: ${{ secrets.TELEGRAM_TECH_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_FREE_TIER_CONFIRMED: ${{ vars.LLM_FREE_TIER_CONFIRMED }}
          GH_TOKEN: ${{ github.token }}
          RETRY_DELIVERY_RUN_ID: ${{ inputs.retry_delivery_run_id }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          DELIVER_TO_MAIN_CHAT: ${{ inputs.deliver_to_main_chat }}
        shell: bash
        run: |
          set -euo pipefail
          bot=./target/release/weekly-gh-digest
          if [[ "$IS_MANUAL" == "true" ]]; then
            if [[ -n "${RETRY_DELIVERY_RUN_ID:-}" ]]; then
              [[ "$RETRY_DELIVERY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "retry_delivery_run_id must contain digits only" >&2; exit 1; }
              source=$(gh run view "$RETRY_DELIVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch)
              [[ "$(jq -r .workflowName <<<"$source")" == "Run Bot" ]] || { echo "Source run is not Run Bot" >&2; exit 1; }
              [[ "$(jq -r .headBranch <<<"$source")" == "$GITHUB_REF_NAME" ]] || { echo "Source run belongs to a different branch" >&2; exit 1; }
              source_dir="$RUNNER_TEMP/weekly-gh-digest-source-$RETRY_DELIVERY_RUN_ID"
              mkdir -p "$source_dir"
              gh run download "$RETRY_DELIVERY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "weekly-gh-digest-$RETRY_DELIVERY_RUN_ID" --dir "$source_dir"
              source_input=""
              while IFS= read -r candidate; do
                if jq -e '.format_version == 3 and (.entries | length >= 1) and all(.entries[]; (.description | type == "string") and (.description | length > 0))' "$candidate" >/dev/null; then
                  source_input="$candidate"
                  break
                fi
              done < <(find "$source_dir" -name ranking-input.json -print | sort -r)
              test -n "$source_input"
              delivery_dir="data/runs/retry-$GITHUB_RUN_ID"
              mkdir -p "$delivery_dir"
              cp -a "$(dirname "$source_input")/." "$delivery_dir/"
              "$bot" debug-delivery "$delivery_dir"
            elif [[ "$DELIVER_TO_MAIN_CHAT" == "true" ]]; then
              "$bot" digest --llm
            elif [[ "$MANUAL_DRY_RUN" == "true" ]]; then
              # Dry runs never spend the daily LLM budget: previews are for
              # pipeline sanity, not for burning Groq requests.
              "$bot" preview --dry-run
            else
              "$bot" debug --llm
            fi
          elif [[ -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${TELEGRAM_CHAT_ID:-}" ]]; then
            "$bot" digest --llm
          else
            "$bot" preview --dry-run
          fi

      - name: Save state and source provenance
        if: always() && steps.restore-state.outcome == 'success' && steps.restore-delivery.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
          RESTORED_STATE_HEAD: ${{ steps.restore-state.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d data ]]; then
            echo "No data directory was created; state was not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          state_dir="$RUNNER_TEMP/weekly-gh-digest-state"
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          remote_head=${remote_ref%%$'\t'*}
          if [[ "$remote_head" != "$RESTORED_STATE_HEAD" ]]; then
            echo "bot-state changed during this run; refusing to overwrite newer state" >&2
            exit 1
          fi
          if [[ -n "$remote_head" ]]; then
            git fetch origin bot-state:refs/remotes/origin/bot-state
            test "$(git rev-parse origin/bot-state)" = "$RESTORED_STATE_HEAD"
            git worktree add "$state_dir" origin/bot-state
          else
            git worktree add --detach "$state_dir" HEAD
            git -C "$state_dir" checkout --orphan bot-state
            git -C "$state_dir" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$state_dir/data"
          cp -a data/. "$state_dir/data/"
          git -C "$state_dir" add data
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m "Update digest state and source archive"
            git -C "$state_dir" push origin HEAD:bot-state
          fi

      - name: Upload run preview and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-gh-digest-${{ github.run_id }}
          path: data/runs/
          if-no-files-found: ignore
          retention-days: 90
