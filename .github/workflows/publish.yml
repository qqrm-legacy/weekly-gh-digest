name: Publish Digest

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only offline preview; false publishes the due daily issue
        type: boolean
        default: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/run-bot.yml
    with:
      operation: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'preview' || 'publish' }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TECH_CHAT_ID: ${{ secrets.TELEGRAM_TECH_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
